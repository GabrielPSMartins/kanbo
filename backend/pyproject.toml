[project]
name = "kanbo-backend"
version = "0.1.0"
description = "Kanbo — gerenciador Scrum pessoal (API)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.159.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # comprimento de linha fica a cargo do ruff format
